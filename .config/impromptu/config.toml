# Impromptu Configuration

[appearance]
dark_mode = true

[behavior]
show_header = true
show_footer = true

[notifications]
enabled = true
sound = false
duration_seconds = 5

[layout]
sidebar_width = 25

[[agents]]
name = "gemini"
path = "/google/bin/releases/gemini-cli/tools/gemini"
flags = "--yolo"
agent_type = "gemini"

[keybindings]
# Key = pane index or tmux command
# M- = Alt, C- = Ctrl
switch_1 = "M-1"
switch_2 = "M-2"
switch_3 = "M-3"
sidebar = "M-i"
new_agent = "M-n"
