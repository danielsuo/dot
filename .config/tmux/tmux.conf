set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-open'

set -g @open 'x'
set -g @open-editor 'C-x'
set -g prefix 'C-z'

# Set theme
set -g @theme_variation 'night'
# set -g @tokyo-night-tmux_theme night
# set -g @tokyo-night-tmux_show_hostname 1

# Use vi keybindings
# set-window-option -g modes vi

# Set xterm keys
# set-window-option -g xterms on

# Rebind pane navigation to vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Rebind copy mode
unbind [
bind - copy-mode

# Rebind pane navigation
unbind p
bind [ previous-window
unbind n
bind ] next-window

# Kill pane without confirmation
bind x kill-pane
bind q kill-window

# toggle pane title visibility
bind T run 'bash -c "arr=( off top ) && tmux setw pane-border-status \${arr[\$(( \${arr[(I)#{pane-border-status}]} % 2 + 1 ))]}"'
# rename pane
bind t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"

# Rebind split window
bind s split-window -v
bind v split-window -h

# Split pane 3 ways vertically
bind ? split-window -v \; split-window -v \; select-layout even-horizontal
bind / split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane

# Resize panes evenly
bind 2 select-layout even-horizontal
bind 3 select-window -t:$ \; split-window -v \; select-layout even-horizontal \; kill-pane
bind 4 select-window -t:$ \; split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane \; kill-pane
bind 5 select-window -t:$ \; split-window -v \; split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane \; kill-pane \; kill-pane

# Resize panes
bind Left resize-pane -L 10
bind Right resize-pane -R 10
bind Up resize-pane -U 10
bind Down resize-pane -D 10

# No delay for escape key press
set -sg escape-time 0

# Focus events
set -g focus-events on

# Reload tmux config
bind u source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

# Turn on mouse moude
set -g mouse on

# # Use the xterm-256color terminal
# set -g default-terminal "xterm-256color"
#
# # Apply Tc
# set-option -ga terminal-overrides ",xterm-256color:Tc"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
