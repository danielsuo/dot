set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @open 'x'
set -g @open-editor 'C-x'
set -g prefix 'C-z'

# Set theme
set -g @theme_variation 'night'
set -g @theme_plugins 'datetime,weather,playerctl,yay'
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

# Rebind pane navigation to vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Kill pane without confirmation
bind x kill-pane
bind q kill-window

# Rebind split window
bind s split-window -v
bind v split-window -h

# Split pane 3 ways vertically
bind ? split-window -v \; split-window -v \; select-layout even-horizontal
bind / split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane

# Resize panes evenly
bind 2 select-layout even-horizontal
bind 3 select-window -t:$ \; split-window -v \; select-layout even-horizontal \; kill-pane
bind 4 select-window -t:$ \; split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane \; kill-pane
bind 5 select-window -t:$ \; split-window -v \; split-window -v \; split-window -v \; select-layout even-horizontal \; kill-pane \; kill-pane \; kill-pane

# Resize panes
bind Left resize-pane -L 10
bind Right resize-pane -R 10
bind Up resize-pane -U 10
bind Down resize-pane -D 10

# No delay for escape key press
set -sg escape-time 0

# Focus events
set -g focus-events on

# Reload tmux config
bind u source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

# Turn on mouse moude
set -g mouse on

# # Use the xterm-256color terminal
# set -g default-terminal "xterm-256color"
#
# # Apply Tc
# set-option -ga terminal-overrides ",xterm-256color:Tc"
# set -as terminal-features ",*:RGB"
set -as terminal-features ",gnome*:RGB"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "tmux-256color"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
TMUX_FZF_LAUNCH_KEY=f

run '~/.config/tmux/plugins/tpm/tpm'
